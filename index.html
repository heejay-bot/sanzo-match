<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<link rel="manifest" href="manifest.json">
<title>配色事典 · A Dictionary of Color Combinations</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>配色事典 <span class="h1en">A Dictionary of Color Combinations</span></h1>
  <p class="sub ja">大正·昭和の色彩ノート</p>
  <p class="sub en">Colour Notes from the Taishō &amp; Shōwa Eras · Sanzo Wada</p>
</header>

<main>
  <section class="card">
    <div class="row">
      <label class="btn primary">사진 촬영 / 업로드
        <input id="file" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <button class="btn" id="pickBtn"><span id="pickDot" class="dot"></span>직접 입력</button>
      <button class="btn" id="favBtn">즐겨찾기</button>
    </div>
    <div id="pickerPanel" hidden>
      <div id="sv" class="sv"><div id="svKnob" class="knob"></div></div>
      <input id="hue" class="hue" type="range" min="0" max="360" value="40">
      <div class="row pick-row">
        <div id="preview" class="swatch preview"></div>
        <input id="hexIn" class="hexin mono" maxlength="7" value="#B8860B" autocomplete="off" spellcheck="false">
        <button class="btn primary" id="applyPick">찾기</button>
      </div>
    </div>
    <div id="stage" hidden>
      <canvas id="canvas"></canvas>
      <p class="hint">사진에서 원하는 지점을 탭하세요 (주변 픽셀 평균)</p>
      <div id="dominant" class="chips"></div>
    </div>
  </section>

  <section id="result" class="card" hidden>
    <div class="picked">
      <div id="pickedSwatch" class="swatch big"></div>
      <div><div class="label">선택한 색</div><div id="pickedHex" class="mono"></div></div>
    </div>
    <h2>가장 가까운 색</h2>
    <div id="matches" class="matches"></div>
    <h2 id="comboTitle">조합</h2>
    <div id="combos"></div>
  </section>

  <section id="favs" class="card" hidden>
    <h2>즐겨찾기 조합</h2>
    <div id="favList"></div>
  </section>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
